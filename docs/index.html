<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Travel Field Cards</title>
<style>
:root {
  --bg: #1a1a2e;
  --card-bg: #16213e;
  --surface: #0f3460;
  --text: #e8e8e8;
  --text-dim: #9a9ab0;
  --accent-blue: #4a90d9;
  --accent-green: #4caf50;
  --accent-red: #e74c3c;
  --accent-purple: #9b59b6;
  --accent-orange: #e67e22;
  --accent-teal: #1abc9c;
  --must: #e74c3c;
  --adjust: #4a90d9;
  --warning: #f39c12;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* --- Top bar / Camera selector --- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 12px 16px 8px;
}
.topbar h1 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
  text-align: center;
}
.preview-badge {
  width: fit-content;
  margin: -3px auto 9px;
  padding: 4px 9px;
  border: 1px solid rgba(243,156,18,0.45);
  border-radius: 999px;
  background: rgba(243,156,18,0.12);
  color: #f5b041;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.9px;
}
.camera-tabs {
  display: flex;
  gap: 8px;
}
.camera-tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--card-bg);
  color: var(--text-dim);
}
.camera-tab.active {
  background: var(--accent-blue);
  color: #fff;
}

/* --- Mode list --- */
.mode-list {
  padding: 12px 16px 100px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.camera-role {
  margin: 2px 2px 5px;
  color: var(--text-dim);
  font-size: 11px;
  line-height: 1.35;
}
.mode-item {
  background: var(--card-bg);
  width: 100%;
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  border-left: 4px solid var(--accent-blue);
  color: inherit;
  font: inherit;
  text-align: left;
}
.mode-item:active { transform: scale(0.98); opacity: 0.9; }
.mode-item:focus-visible, .tab-btn:focus-visible, .camera-tab:focus-visible, .back-btn:focus-visible {
  outline: 3px solid var(--accent-teal);
  outline-offset: 2px;
}
.mode-item[data-color="green"] { border-left-color: var(--accent-green); }
.mode-item[data-color="red"] { border-left-color: var(--accent-red); }
.mode-item[data-color="purple"] { border-left-color: var(--accent-purple); }
.mode-item[data-color="orange"] { border-left-color: var(--accent-orange); }
.mode-item[data-color="teal"] { border-left-color: var(--accent-teal); }

.mode-code {
  font-size: 18px;
  font-weight: 700;
  min-width: 52px;
  color: #fff;
}
.mode-info { flex: 1; }
.mode-name {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}
.mode-desc {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 2px;
  line-height: 1.3;
}
.mode-arrow {
  color: var(--text-dim);
  font-size: 18px;
}
.variant-count {
  display: inline-block;
  margin-top: 5px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(26,188,156,0.12);
  color: var(--accent-teal);
  font-size: 10px;
  font-weight: 700;
}

/* --- Card detail view --- */
.card-view {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.card-view.open { transform: translateX(0); }

.card-header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.card-header.color-blue { background: linear-gradient(135deg, #2a5298, #1e3c72); }
.card-header.color-green { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
.card-header.color-red { background: linear-gradient(135deg, #c62828, #b71c1c); }
.card-header.color-purple { background: linear-gradient(135deg, #6a1b9a, #4a148c); }
.card-header.color-orange { background: linear-gradient(135deg, #e65100, #bf360c); }
.card-header.color-teal { background: linear-gradient(135deg, #00897b, #00695c); }

.back-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-size: 20px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.card-title { flex: 1; }
.card-title .code { font-size: 22px; font-weight: 700; color: #fff; }
.card-title .name { font-size: 13px; color: rgba(255,255,255,0.8); }

/* --- Tab switcher (Front / Back) --- */
.tab-bar {
  display: flex;
  margin: 12px 16px 0;
  background: var(--card-bg);
  border-radius: 10px;
  padding: 3px;
}
.tab-btn {
  flex: 1;
  padding: 10px 5px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  color: var(--text-dim);
}
.tab-btn.active {
  background: var(--surface);
  color: #fff;
}

.tab-content { display: none; padding: 12px 16px; }
.tab-content.active { display: block; }

/* --- Front: Physical setup --- */
.section-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin: 16px 0 8px;
  padding: 6px 10px;
  border-radius: 6px;
}
.section-label.must {
  background: rgba(231,76,60,0.15);
  color: var(--must);
}
.section-label.adjust {
  background: rgba(74,144,217,0.15);
  color: var(--adjust);
}
.section-label.settings {
  background: rgba(155,89,182,0.15);
  color: var(--accent-purple);
}
.section-label.hints {
  background: rgba(241,196,15,0.15);
  color: var(--warning);
}
.section-label.why {
  background: rgba(26,188,156,0.15);
  color: var(--accent-teal);
}
.section-label.alternatives {
  background: rgba(26,188,156,0.15);
  color: var(--accent-teal);
}

.setup-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.setup-row {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.setup-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}
.setup-detail { flex: 1; }
.setup-item {
  font-size: 13px;
  color: var(--text-dim);
}
.setup-value {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
.setup-note {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* --- Field adjustments --- */
.adjust-row {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 10px 12px;
}
.adjust-row.warning-row {
  background: rgba(231,76,60,0.12);
  border: 1px solid rgba(231,76,60,0.3);
}
.adjust-row .dial-label {
  font-size: 12px;
  color: var(--accent-blue);
  font-weight: 600;
}
.adjust-row .dial-value {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}
.adjust-row .dial-note {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}
.tip-row {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
}
.warning-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--must);
}

/* --- Back: Settings table --- */
.settings-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--card-bg);
  border-radius: 10px;
  overflow: hidden;
}
.settings-table tr { border-bottom: 1px solid rgba(255,255,255,0.05); }
.settings-table tr:last-child { border-bottom: none; }
.settings-table td {
  padding: 8px 10px;
  font-size: 12px;
  vertical-align: top;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.settings-table tr:last-child td { border-bottom: none; }
.settings-table .param { color: var(--text-dim); width: 30%; }
.settings-table .val { color: #fff; font-weight: 600; width: 25%; }
.settings-table .rat { color: var(--text-dim); font-style: italic; }

/* --- Focus bracket coverage guide --- */
.coverage-guide {
  margin-top: 14px;
  background: var(--card-bg);
  border-radius: 10px;
  padding: 12px;
}
.coverage-guide h3 {
  margin: 0 0 4px;
  color: #fff;
  font-size: 15px;
}
.coverage-baseline {
  color: var(--green);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.coverage-summary, .coverage-note {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.4;
}
.coverage-scroll {
  overflow-x: auto;
  margin: 10px -4px 8px;
}
.coverage-scroll-hint { display: none; }
.coverage-table {
  width: 100%;
  min-width: 460px;
  border-collapse: collapse;
  text-align: center;
}
.coverage-table th, .coverage-table td {
  padding: 7px 6px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-size: 12px;
}
.coverage-table th { color: var(--text-dim); font-weight: 600; }
.coverage-table td { color: #fff; font-weight: 700; }
.coverage-table th:first-child, .coverage-table td:first-child {
  position: sticky;
  left: 0;
  background: var(--card-bg);
}
.coverage-notes { margin: 8px 0 0; padding-left: 18px; }
.coverage-note + .coverage-note { margin-top: 4px; }
@media (max-width: 520px) {
  .coverage-scroll-hint {
    display: block;
    margin-top: 8px;
    color: var(--accent-teal);
    font-size: 11px;
    font-weight: 700;
    text-align: right;
  }
}

/* --- Hints --- */
.hint-item {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
}

.why-text {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 12px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  font-style: italic;
}

/* --- Description banner --- */
.desc-banner {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 12px;
  margin: 12px 0 4px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.4;
  font-style: italic;
}
.usage-scenarios {
  margin: 10px 0 4px;
  border: 1px solid rgba(74,144,217,0.25);
  border-radius: 10px;
  background: rgba(74,144,217,0.08);
  overflow: hidden;
}
.usage-scenarios summary {
  cursor: pointer;
  padding: 10px 12px;
  color: var(--adjust);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.4px;
}
.usage-scenarios[open] summary {
  border-bottom: 1px solid rgba(74,144,217,0.18);
}
.usage-paragraphs {
  padding: 2px 12px 11px;
}
.usage-paragraphs p {
  margin: 9px 0 0;
  color: var(--text);
  font-size: 12px;
  line-height: 1.52;
}

/* --- Equipment notes --- */
.equip-notes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.equip-tag {
  background: rgba(74,144,217,0.15);
  color: var(--accent-blue);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
}
.physical-intro {
  margin: 10px 0;
  padding: 10px 12px;
  border: 1px solid rgba(243,156,18,0.32);
  border-radius: 10px;
  background: rgba(243,156,18,0.09);
  color: var(--text);
  font-size: 12px;
  line-height: 1.45;
}
.physical-badge {
  display: inline-block;
  margin-bottom: 3px;
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(243,156,18,0.16);
  color: #f5b041;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.6px;
}

/* --- Alternative configurations --- */
.alternative-intro {
  background: rgba(26,188,156,0.09);
  border: 1px solid rgba(26,188,156,0.25);
  border-radius: 10px;
  padding: 11px 12px;
  margin: 12px 0;
  color: var(--text);
  font-size: 12px;
  line-height: 1.45;
}
.alternative-card {
  background: var(--card-bg);
  border: 1px solid rgba(255,255,255,0.07);
  border-left: 3px solid var(--accent-teal);
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 10px;
}
.alternative-name {
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.alternative-when {
  color: var(--text-dim);
  font-size: 12px;
  line-height: 1.4;
  margin-bottom: 10px;
}
.alternative-explanation {
  margin: 8px 0 10px;
  padding: 9px 10px;
  border-radius: 8px;
  background: rgba(74,144,217,0.10);
  border: 1px solid rgba(74,144,217,0.22);
  color: var(--text);
  font-size: 12px;
  line-height: 1.48;
}
.alternative-explanation strong {
  display: block;
  margin-bottom: 3px;
  color: var(--adjust);
}
.alternative-steps {
  margin: 8px 0 11px;
  padding: 9px 10px 9px 30px;
  border-radius: 8px;
  background: rgba(255,255,255,0.035);
  color: var(--text);
  font-size: 11px;
  line-height: 1.48;
}
.alternative-steps::before {
  content: 'HOW TO USE IT';
  display: block;
  margin: 0 0 5px -20px;
  color: var(--accent-teal);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.7px;
}
.alternative-steps li { margin: 4px 0; }
.alternative-change {
  display: grid;
  grid-template-columns: minmax(90px, 0.8fr) 1.2fr;
  gap: 2px 10px;
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.alternative-change .item {
  color: var(--text-dim);
  font-size: 11px;
}
.alternative-change .value {
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}
.alternative-change .note {
  grid-column: 2;
  color: var(--text-dim);
  font-size: 10px;
  line-height: 1.35;
}
.alternative-warning {
  margin-top: 7px;
  padding: 7px 9px;
  border-radius: 7px;
  background: rgba(243,156,18,0.11);
  color: #f5b041;
  font-size: 11px;
  line-height: 1.4;
}
.empty-alternatives {
  color: var(--text-dim);
  text-align: center;
  font-size: 13px;
  padding: 28px 12px;
}

/* --- Smooth scrollbar --- */
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Travel Field Cards</h1>
  <div class="preview-badge" id="previewBadge">US PARKS 2026</div>
  <div class="camera-tabs" id="cameraTabs"></div>
</div>

<div class="mode-list" id="modeList"></div>
<div class="card-view" id="cardView"></div>

<script>
let data = null;
let currentCamera = 0;

const ICONS = {
  'Mode dial': '🎛️', 'Focus lever': '🔀', 'Drive dial': '⚡', 'Drive': '⚡',
  'Function Lever': '🎚️', 'Lens': '🔭', 'Lens IS switch': '📐', 'Support': '📸',
  'Filter': '🕶️', 'Trigger': '📡', 'Audio': '🎙️', 'Flash: X3 trigger': '📡',
  'Flash: AD100Pro': '⚡', 'Flash: ML-CD15': '💡', 'Flash': '⚡',
  'default': '⚙️'
};

function getIcon(item) { return ICONS[item] || ICONS['default']; }

async function init() {
  const resp = await fetch('field-cards.json');
  data = await resp.json();
  document.getElementById('previewBadge').textContent = data._metadata.status || 'FIELD REFERENCE';
  renderCameraTabs();
  renderModes();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
}

function renderCameraTabs() {
  const el = document.getElementById('cameraTabs');
  el.innerHTML = data.cameras.map((cam, i) =>
    `<button type="button" class="camera-tab ${i === currentCamera ? 'active' : ''}" aria-pressed="${i === currentCamera}" onclick="switchCamera(${i})">${cam.camera_short}</button>`
  ).join('');
}

function switchCamera(i) {
  currentCamera = i;
  renderCameraTabs();
  renderModes();
  closeCard();
}

function renderModes() {
  const cam = data.cameras[currentCamera];
  document.getElementById('modeList').innerHTML =
    `<div class="camera-role"><strong>${cam.camera}</strong> · ${cam.role || ''}<br>${cam.settings_note || 'Camera settings and values are shown in English.'}</div>` +
    cam.modes.map((m, i) =>
    `<button type="button" class="mode-item" data-color="${m.color}" onclick="openCard(${i})" aria-label="Open ${m.code}: ${m.name}">
      <div class="mode-code">${m.code}</div>
      <div class="mode-info">
        <div class="mode-name">${m.name}</div>
        <div class="mode-desc">${m.description}</div>
        <div class="variant-count">${(m.alternatives || []).length} alternative${(m.alternatives || []).length === 1 ? '' : 's'}</div>
      </div>
      <div class="mode-arrow">›</div>
    </button>`
  ).join('');
}

function openCard(i) {
  const m = data.cameras[currentCamera].modes[i];
  const cv = document.getElementById('cardView');
  cv.innerHTML = buildCard(m);
  requestAnimationFrame(() => { cv.classList.add('open'); cv.scrollTop = 0; });
}

function closeCard() {
  document.getElementById('cardView').classList.remove('open');
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    const active = b.dataset.tab === tab;
    b.classList.toggle('active', active);
    b.setAttribute('aria-selected', active);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    const active = c.dataset.tab === tab;
    c.classList.toggle('active', active);
    c.hidden = !active;
  });
}

function buildCard(m) {
  const f = m.front;
  const b = m.back;
  const isGoPro = data.cameras[currentCamera].camera_short === 'H12';

  // Physical setup rows
  const physicalControlPattern = /mode dial|focus lever|drive|function lever|lens is switch|focus range selector|zoom limit|o\.i\.s\. switch/i;
  const setupHtml = f.physical_setup.map(s =>
    `<div class="setup-row">
      <div class="setup-icon">${getIcon(s.item)}</div>
      <div class="setup-detail">
        ${physicalControlPattern.test(s.item) ? '<div class="physical-badge">PHYSICAL CONTROL</div>' : ''}
        <div class="setup-item">${s.item}</div>
        <div class="setup-value">${s.value}</div>
        ${s.note ? `<div class="setup-note">${s.note}</div>` : ''}
      </div>
    </div>`
  ).join('');

  // Field adjustments
  const adjustHtml = f.field_adjustments.map(a => {
    if (a.type === 'warning') {
      return `<div class="adjust-row warning-row"><div class="warning-text">⚠️ ${a.text}</div></div>`;
    } else if (a.type === 'dial') {
      return `<div class="adjust-row">
        <div class="dial-label">${a.item}</div>
        <div class="dial-value">${a.value}</div>
        ${a.note ? `<div class="dial-note">${a.note}</div>` : ''}
      </div>`;
    } else {
      return `<div class="tip-row">💡 ${a.text}</div>`;
    }
  }).join('');

  // Settings table
  const settingsHtml = b.software_settings.map(s =>
    `<tr><td class="param">${s.param}</td><td class="val">${s.value}</td><td class="rat">${s.rationale}</td></tr>`
  ).join('');

  // Hints
  const hintsHtml = b.hints.map(h => `<div class="hint-item">💡 ${h}</div>`).join('');

  // Equipment notes
  const equipHtml = b.equipment_notes
    ? `<div class="equip-notes">${b.equipment_notes.map(n => `<span class="equip-tag">${n}</span>`).join('')}</div>`
    : '';

  const alternatives = m.alternatives || [];
  const usageScenarios = m.usage_scenarios || [];
  const usageHtml = usageScenarios.length
    ? `<details class="usage-scenarios" open>
        <summary>When to Use This Mode</summary>
        <div class="usage-paragraphs">${usageScenarios.map(p => `<p>${p}</p>`).join('')}</div>
      </details>`
    : '';
  const coverage = m.coverage_guide;
  const coverageHtml = coverage
    ? `<section class="coverage-guide" aria-label="${coverage.title || 'Focus Bracket Coverage'}">
        <h3>${coverage.title}</h3>
        <div class="coverage-baseline">Saved baseline: ${coverage.baseline}</div>
        <div class="coverage-summary">${coverage.summary}</div>
        <div class="coverage-scroll-hint">Deslize a tabela →</div>
        <div class="coverage-scroll">
          <table class="coverage-table">
            <thead><tr>${coverage.columns.map(c => `<th scope="col">${c.label}</th>`).join('')}</tr></thead>
            <tbody>${coverage.rows.map(row => `<tr>${coverage.columns.map((c, index) => `<td>${row[c.key]}${index === 0 ? ' mm' : ''}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>
        <ul class="coverage-notes">${coverage.notes.map(n => `<li class="coverage-note">${n}</li>`).join('')}</ul>
      </section>`
    : '';
  const alternativesHtml = alternatives.length
    ? alternatives.map(a => {
        const changes = (a.changes || []).map(c =>
          `<div class="alternative-change">
            <div class="item">${physicalControlPattern.test(c.item) ? '<span class="physical-badge">PHYSICAL CONTROL</span><br>' : ''}${c.item}</div>
            <div class="value">${c.value}</div>
            ${c.note ? `<div class="note">${c.note}</div>` : ''}
          </div>`
        ).join('');
        const warnings = (a.warnings || []).map(w =>
          `<div class="alternative-warning">⚠️ ${w}</div>`
        ).join('');
        const explanation = a.what_it_does
          ? `<div class="alternative-explanation"><strong>What it does</strong>${a.what_it_does}</div>`
          : '';
        const steps = (a.steps || []).length
          ? `<ol class="alternative-steps">${a.steps.map(step => `<li>${step}</li>`).join('')}</ol>`
          : '';
        return `<div class="alternative-card">
          <div class="alternative-name">${a.name}</div>
          <div class="alternative-when"><strong>Quando usar:</strong> ${a.when}</div>
          ${explanation}
          ${steps}
          ${changes}
          ${warnings}
        </div>`;
      }).join('')
    : `<div class="empty-alternatives">No alternative configurations defined.</div>`;

  return `
    <div class="card-header color-${m.color}">
      <button class="back-btn" onclick="closeCard()">‹</button>
      <div class="card-title">
        <div class="code">${m.code}</div>
        <div class="name">${m.name}</div>
        ${m.display_title ? `<div class="name">Camera title: ${m.display_title}</div>` : ''}
      </div>
    </div>

    <div class="tab-bar" role="tablist" aria-label="Card sections">
      <button id="tab-front" class="tab-btn active" role="tab" aria-selected="true" aria-controls="panel-front" data-tab="front" onclick="switchTab('front')">In the Field</button>
      <button id="tab-back" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-back" data-tab="back" onclick="switchTab('back')">Saved Settings</button>
      <button id="tab-alternatives" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-alternatives" data-tab="alternatives" onclick="switchTab('alternatives')">Alternatives</button>
    </div>

    <div id="panel-front" class="tab-content active" role="tabpanel" aria-labelledby="tab-front" data-tab="front">
      <div class="desc-banner">${m.description}</div>
      ${usageHtml}
      <div class="section-label must">⚙️ Physical Controls &amp; Setup</div>
      <div class="physical-intro">${isGoPro
        ? '<strong>Set before shooting.</strong> Confirm the Quik family, selected mode, mount and operator before capture.'
        : '<strong>Set before shooting.</strong> A recalled Custom Mode cannot move a physical dial, lever or lens switch. Confirm every position shown below.'}</div>
      <div class="setup-list">${setupHtml}</div>
      <div class="section-label adjust">🎚️ Ajustar no Campo</div>
      <div class="setup-list">${adjustHtml}</div>
      ${coverageHtml}
      ${equipHtml}
    </div>

    <div id="panel-back" class="tab-content" role="tabpanel" aria-labelledby="tab-back" data-tab="back" hidden>
      <div class="section-label settings">📋 Saved Settings</div>
      <table class="settings-table">${settingsHtml}</table>
      <div class="section-label hints">💡 Dicas de Campo</div>
      <div class="setup-list">${hintsHtml}</div>
      ${b.why ? `<div class="section-label why">📖 Por Que Estas Configurações?</div><div class="why-text">${b.why}</div>` : ''}
    </div>

    <div id="panel-alternatives" class="tab-content" role="tabpanel" aria-labelledby="tab-alternatives" data-tab="alternatives" hidden>
      <div class="alternative-intro">${isGoPro
        ? '<strong>Temporary field variants.</strong> Use only under the stated conditions and restore the saved baseline afterward.'
        : '<strong>Temporary field variants.</strong> Use only under the stated conditions. Do not overwrite the saved Custom Mode unless a calibrated change is explicitly approved.'}</div>
      <div class="section-label alternatives">🔀 Alternative Configurations</div>
      ${alternativesHtml}
    </div>
  `;
}

init();
</script>
</body>
</html>
